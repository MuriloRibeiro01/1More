name: onemore

services:
  postgres:
    image: postgres:16-alpine
    container_name: onemore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onemore}
      POSTGRES_USER: ${POSTGRES_USER:-onemore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onemore_dev}
    ports:
      # Só em localhost (nunca na rede). Porta do host configurável; 5433 por padrão para não colidir
      # com um PostgreSQL nativo na 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onemore} -d ${POSTGRES_DB:-onemore}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
